# Docker 29 does not publish host ports from an internal bridge. This host-only
# bridge preserves Web's no-default-route isolation while exposing one loopback
# endpoint for the public TLS virtual host.
server {
    listen 127.0.0.1:__WEB_PORT__;
    server_name _;

    access_log off;
    server_tokens off;
    client_max_body_size 128m;

    location / {
        proxy_pass http://__WEB_CONTAINER_IP__:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $adobe2api_connection_upgrade;

        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
    }
}

