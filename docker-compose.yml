name: adobe2api-plus

# ─────────────────────────────────────────────────────────────────────────────
# 安全部署：
#   cp .env.example .env           # 先填写全部必填变量
#   docker compose up -d --build   # 默认只启动 mysql + web
#   docker compose --profile upstream up -d --build  # 明确授权后才启动 worker + mint
#
# mint = fingerprint-chromium 铸造服务（headful + Xvfb，替代 RoxyBrowser），
# sherlockToken 由 worker 按周期（默认 5 分钟）自动向 mint 拉取，无需任何外部依赖。
#
# 不提供默认管理员、密钥或数据库密码。
# 数据库表结构由应用首次启动时自动创建（幂等 migrate，无需手动 db:push）。
# ─────────────────────────────────────────────────────────────────────────────

x-mint-env: &mint-env
  SHERLOCK_MINT_API: http://mint:8777

x-app-env: &app-env
  <<: *mint-env
  DATABASE_URL: mysql://${MYSQL_USER:?MYSQL_USER is required}:${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}@mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
  ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:?ADMIN_BOOTSTRAP_USERNAME is required}
  ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?ADMIN_BOOTSTRAP_PASSWORD is required}
  MEDIA_ROOT: /app/data/generated
  NEXT_TELEMETRY_DISABLED: "1"

services:
  # MySQL 8 数据库
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    # 数据库不对外暴露端口，仅 compose 内网（web/worker 通过服务名 mysql 访问）
    # 表结构由应用启动时自动迁移（src/lib/schema.ts 的 ensureSchema），无需 init 脚本。
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Mint：fingerprint-chromium sherlockToken 铸造服务（headful + Xvfb，替代 RoxyBrowser）
  # fingerprint-chromium 148 仅发布 x86_64 二进制：x86_64 服务器原生运行；
  # Apple Silicon 宿主机由 Docker Desktop 模拟 amd64 运行（能跑但铸造较慢，生产请用 x86_64）。
  mint:
    profiles: ["upstream"]
    platform: linux/amd64
    build:
      context: ./docker/mint
      dockerfile: Dockerfile
    image: adobe2api-plus-mint:local
    environment:
      MINT_CHROME_BIN: /opt/fpchrome/chrome
      MINT_PORT: "8777"
      MINT_HEADLESS: ${MINT_HEADLESS:-0}
    restart: unless-stopped
    # 首次铸造才会拉满 CPU 几秒；不给高配额，避免影响主业务
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  # Web：Next.js（OpenAI 兼容 API 网关 + 管理后台）
  web:
    image: adobe2api-plus:local
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-env
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - generated-media:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  # Worker：后台任务（账号刷新 / sherlock 令牌 / 生成任务调度）
  # 直接复用 web 构建出的镜像（两份构建会并行各跑一次 npm run build，偶发资源竞态失败；
  # 且同镜像名并发导出在 compose v5 bake 下会偶发 "already exists"）。
  # compose 先完成全部 build 再启动容器，因此 worker 总能拿到 web 刚构建好的镜像。
  worker:
    profiles: ["upstream"]
    image: adobe2api-plus:local
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/worker/index.ts"]
    environment: *app-env
    volumes:
      - generated-media:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      mint:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  generated-media:
