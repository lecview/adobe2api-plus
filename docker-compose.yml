name: adobe2api-plus

# ─────────────────────────────────────────────────────────────────────────────
# 一键部署（零配置，开箱即用）：
#   docker compose up -d --build   # 自动构建镜像并启动 mysql + web + worker + mint
#
# mint = fingerprint-chromium 铸造服务（headful + Xvfb，替代 RoxyBrowser），
# sherlockToken 由 worker 按周期（默认 5 分钟）自动向 mint 拉取，无需任何外部依赖。
#
# 默认管理员 admin / admin，密钥用内置默认值。
# 生产环境务必在 .env 中覆盖 SESSION_SECRET / ENCRYPTION_KEY / 管理员密码。
# 数据库表结构由应用首次启动时自动创建（幂等 migrate，无需手动 db:push）。
# ─────────────────────────────────────────────────────────────────────────────

x-mint-env: &mint-env
  SHERLOCK_MINT_API: http://mint:8777

x-app-env: &app-env
  <<: *mint-env
  DATABASE_URL: mysql://${MYSQL_USER:-adobe}:${MYSQL_PASSWORD:-adobe}@mysql:3306/${MYSQL_DATABASE:-adobe}
  SESSION_SECRET: ${SESSION_SECRET:-ade29e218eecbf7cb7abf14c6fbb8bac5f9396cb2784c094d2a4dee1020abf53}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dbc3134bae062969b83084f7aced31710d55372228a1231066adc6c0777778ab}
  ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-admin}
  ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-admin}
  MEDIA_ROOT: /app/data/generated
  NEXT_TELEMETRY_DISABLED: "1"

services:
  # MySQL 8 数据库
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-adobe}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-adobe}
      MYSQL_USER: ${MYSQL_USER:-adobe}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-adobe}
      TZ: ${TZ:-Asia/Shanghai}
    # 数据库不对外暴露端口，仅 compose 内网（web/worker 通过服务名 mysql 访问）
    # 表结构由应用启动时自动迁移（src/lib/schema.ts 的 ensureSchema），无需 init 脚本。
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  # Mint：fingerprint-chromium sherlockToken 铸造服务（headful + Xvfb，替代 RoxyBrowser）
  # fingerprint-chromium 148 仅发布 x86_64 二进制：x86_64 服务器原生运行；
  # Apple Silicon 宿主机由 Docker Desktop 模拟 amd64 运行（能跑但铸造较慢，生产请用 x86_64）。
  mint:
    platform: linux/amd64
    build:
      context: ./docker/mint
      dockerfile: Dockerfile
    image: adobe2api-plus-mint:local
    environment:
      MINT_CHROME_BIN: /opt/fpchrome/chrome
      MINT_PORT: "8777"
      MINT_HEADLESS: ${MINT_HEADLESS:-0}
    restart: unless-stopped
    # 首次铸造才会拉满 CPU 几秒；不给高配额，避免影响主业务
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  # Web：Next.js（OpenAI 兼容 API 网关 + 管理后台）
  web:
    image: adobe2api-plus:local
    build:
      context: .
      dockerfile: Dockerfile
    environment: *app-env
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - generated-media:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      mint:
        condition: service_healthy
    restart: unless-stopped

  # Worker：后台任务（账号刷新 / sherlock 令牌 / 生成任务调度）
  # 与 web 分开打 tag：compose v5 bake 对同一镜像名并发导出会偶发 "already exists"
  worker:
    image: adobe2api-plus-worker:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "node_modules/tsx/dist/cli.mjs", "src/worker/index.ts"]
    environment: *app-env
    volumes:
      - generated-media:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      mint:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  generated-media:
